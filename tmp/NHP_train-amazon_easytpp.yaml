NHP_train:
  base_config:
    backend: torch
    base_dir: ./checkpoints/
    dataset_id: taxi
    model_id: NHP
    runner_id: std_tpp
    stage: train
  model_config:
    hidden_size: 32
    loss_integral_num_sample_per_step: 20
    thinning:
      dtime_max: 5
      look_ahead_time: 10
      num_exp: 500
      num_sample: 1
      num_samples_boundary: 5
      num_seq: 10
      num_step_gen: 1
      over_sample_rate: 5
      patience_counter: 5
  trainer_config:
    batch_size: 256
    gpu: -1
    learning_rate: 0.001
    max_epoch: 2
    metrics:
    - acc
    - rmse
    optimizer: adam
    seed: 2019
    shuffle: false
    use_tfb: true
    valid_freq: 1
data:
  amazon_easytpp:
    data_format: json
    data_specs:
      num_event_types: 16
      pad_token_id: 16
      padding_side: right
    test_dir: ddrg/NEDTBench/amazon_easytpp
    train_dir: ddrg/NEDTBench/amazon_easytpp
    valid_dir: ddrg/NEDTBench/amazon_easytpp
pipeline_config_id: runner_config
